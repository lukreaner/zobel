name: Sync with Sable

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zobel-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge Sable's main branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Sync with Sable needs attention
    steps:
      - name: Check out Zobel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Sable's main branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          scripts/zobel/sync-upstream.sh > "$RUNNER_TEMP/sync.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/sync.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Push the merge
        id: push
        if: steps.merge.outputs.status == '0'
        run: git push origin HEAD:main > "$RUNNER_TEMP/push.log" 2>&1 || { cat "$RUNNER_TEMP/push.log"; exit 1; }

      - name: Open an issue when the sync needs a person
        if: failure() || steps.merge.outputs.status != '0'
        run: |
          {
            echo "The daily merge of Sable's \`main\` branch into Zobel did not go through."
            echo
            echo "To finish it by hand, run \`scripts/zobel/sync-upstream.sh\` in a clone of Zobel,"
            echo "resolve what it reports, and push. [\`docs/zobel.md\`](https://github.com/${GH_REPO}/blob/main/docs/zobel.md) has the details."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync.log" "$RUNNER_TEMP/push.log" 2>/dev/null | tail -n 60
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 1
