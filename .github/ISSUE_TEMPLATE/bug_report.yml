name: Bug Report
description: Report a bug
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        ## First of all
        1. Please search for [existing issues](https://github.com/lukreaner/zobel/issues) about this problem first.
        2. Make sure Zobel is up to date.
        3. Zobel is a fork of [Sable](https://git.sable.moe/SableClient/sable-next). If you know the problem also happens in Sable itself, please say so.
        4. If this is a security vulnerability, do not open a public issue. Use [private vulnerability reporting](https://github.com/lukreaner/zobel/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Describe what happened and what you expected instead. Include screenshots if applicable.
      placeholder: What happened? What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior, or explain if it happens intermittently and you cannot reproduce it reliably.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error

  - type: dropdown
    id: platforms
    attributes:
      label: What platforms have you experienced this issue on?
      description: Select specific platforms, or Desktop, Mobile, or All only if the issue occurs across that entire group.
      multiple: true
      options:
        - Web
        - Desktop
        - Windows
        - macOS
        - Linux
        - Mobile
        - iOS
        - Android
        - All

  - type: textarea
    id: info
    attributes:
      label: Environment and versions
      description: 'Provide the build and Zobel version you are using, your browser if applicable, and your homeserver.'
      placeholder: |
        1. Build: [e.g. the web app, or the desktop/mobile app]
        2. Zobel version: [e.g. 26.11.0]
        3. Browser: [e.g. Chrome 140, Firefox 142 — web builds only]
        4. Matrix homeserver: [e.g. matrix.org]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
